<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Proposta Moresco</title>
<style>
  @font-face { font-family:Caladea; font-style:normal; font-weight:400; src:url(fonts/caladea-400-normal.woff2) format("woff2"); }
  @font-face { font-family:Caladea; font-style:normal; font-weight:700; src:url(fonts/caladea-700-normal.woff2) format("woff2"); }
  @font-face { font-family:Caladea; font-style:italic; font-weight:400; src:url(fonts/caladea-400-italic.woff2) format("woff2"); }
  @font-face { font-family:Carlito; font-style:normal; font-weight:400; src:url(fonts/carlito-400-normal.woff2) format("woff2"); }
  @font-face { font-family:Carlito; font-style:normal; font-weight:700; src:url(fonts/carlito-700-normal.woff2) format("woff2"); }
  @font-face { font-family:Carlito; font-style:italic; font-weight:400; src:url(fonts/carlito-400-italic.woff2) format("woff2"); }
  :root { --dark:#0B2923; --gold:#D3B36A; --muted:#C9D3CE; --green2:#3F5F54; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#061915; overflow:hidden; overscroll-behavior:none; }
  body { display:flex; align-items:center; justify-content:center; touch-action:none;
         -webkit-user-select:none; user-select:none; }
  .serif { font-family: Cambria, Caladea, Georgia, serif; }
  .sans  { font-family: Calibri, Carlito, "Helvetica Neue", Arial, sans-serif; }
  #stage { position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9;
           container-type:inline-size; }
  .slide { position:absolute; inset:0; display:none; }
  .slide.on { display:block; }
  .slide img.bg { position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none; }
  .t { position:absolute; margin:0; line-height:1.2; white-space:nowrap; }
  .mid { display:flex; align-items:center; }
  .wrap { white-space:normal; }
  .hot { position:absolute; cursor:pointer; }
  canvas.ink { position:absolute; inset:0; width:100%; height:100%; }
  #tools { position:fixed; right:10px; top:10px; display:flex; gap:6px; opacity:.35; z-index:5; transition:opacity .2s; }
  #tools:hover, #tools.pen { opacity:.95; }
  #tools button { font:600 13px/1 Calibri, Carlito, Arial, sans-serif; color:var(--gold); background:rgba(11,41,35,.9);
                  border:1px solid var(--gold); border-radius:6px; padding:7px 10px; cursor:pointer; }
  #tools.pen #penBtn { background:var(--gold); color:var(--dark); }
  .pdfbtn { position:absolute; display:flex; align-items:center; justify-content:center; gap:.5em; margin:0; padding:0;
            font:700 1.05cqw/1 Calibri, Carlito, Arial, sans-serif; letter-spacing:.08em; color:var(--dark);
            background:var(--gold); border:0; border-radius:.5cqw; cursor:pointer; box-shadow:0 .2cqw .6cqw rgba(11,41,35,.25); }
  #pdfBox { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(6,25,21,.72); z-index:10; }
  #pdfBox.on { display:flex; }
  #pdfBox .card { background:#F5F2EC; color:var(--dark); border-radius:14px; padding:26px 28px; width:min(92vw, 440px);
                  font-family:Calibri, Carlito, Arial, sans-serif; text-align:center; }
  #pdfBox h2 { font:700 22px/1.2 Cambria, Caladea, Georgia, serif; margin:0 0 8px; }
  #pdfBox p { margin:0 0 18px; font-size:15px; line-height:1.4; color:#3F5F54; }
  #pdfBox button { display:block; width:100%; margin-top:10px; padding:13px; font:700 16px/1 Calibri, Carlito, Arial, sans-serif;
                   border-radius:8px; cursor:pointer; border:1px solid var(--dark); background:transparent; color:var(--dark); }
  #pdfBox button.main { background:var(--dark); color:var(--gold); }
</style>
</head>

<script>
(function () {
  window.addEventListener("hashchange", function () { location.reload(); });
  // ---------- dados vindos da planilha (no #fragmento do link, não vão para o servidor) ----------
  var raw = (location.hash || "").replace(/^#/, "") || (location.search || "").replace(/^\?/, "");
  var q = {};
  raw.split("&").forEach(function (kv) {
    if (!kv) return;
    var i = kv.indexOf("="), k = i < 0 ? kv : kv.slice(0, i), v = i < 0 ? "" : kv.slice(i + 1);
    try { q[k] = decodeURIComponent(v.replace(/\+/g, " ")); } catch (e) { q[k] = v; }
  });
  var OBJ = { "1": "Conquista planejada", "2": "Alavancagem imobiliária", "3": "Previdência", "4": "Venda de cota contemplada" };
  function num(k) { var v = parseFloat(String(q[k] || "").replace(",", ".")); return isFinite(v) && v > 0 ? v : null; }
  function brl(v) { return "R$ " + Math.round(v).toLocaleString("pt-BR"); }
  function short(v) {
    if (v >= 1e6) { var m = Math.round(v / 1e5) / 10; return "R$ " + m.toLocaleString("pt-BR") + (m >= 2 ? " milhões" : " milhão"); }
    return "R$ " + Math.round(v / 1000).toLocaleString("pt-BR") + " mil";
  }
  function set(id, txt) { var el = document.getElementById(id); if (el) el.textContent = txt; }

  var obj = OBJ[q.o] || q.on || "________________";
  var c = num("c"), idade = num("i"), renda = num("r"), pi = num("pi"), pr = num("p"), f = num("f");

  set("v-obj", obj);
  set("v-cred", c ? brl(c) : "R$ __________");
  set("v-idade", idade ? Math.round(idade) + " anos" : "____ anos");
  set("v-renda", renda ? brl(renda) : "R$ __________");

  set("v-sub", "Patrimônio Inteligente · carta de " + (c ? short(c) : "R$ ____"));
  set("v-pi", pi ? brl(pi) : "R$ ____");
  if (f && pr) {
    set("v-pr", brl(pr));
    set("v-selo", "−" + Math.round(f) + "%");
    set("v-nota1", "Parcela reduzida em " + Math.round(f) + "% até a contemplação");
  } else {
    set("v-pr", pi ? brl(pi) : "R$ ____");
    set("v-nota1", "Sem redução de parcela nesta simulação.");
  }

  var VAL = 0.0544; // valorização média dos imóveis, 12 meses (FipeZAP, out/2026)
  set("v-eyebrow", "NA SUA CARTA DE " + (c ? short(c).toUpperCase() : "R$ ____"));
  var frase = document.getElementById("v-frase");
  frase.innerHTML = "";
  frase.appendChild(document.createTextNode("Esperar um ano pode custar, em média, "));
  var b = document.createElement("b"); b.style.color = "var(--gold)"; b.textContent = c ? short(c * VAL) : "R$ ____";
  frase.appendChild(b);
  frase.appendChild(document.createTextNode(" a mais no preço do bem."));
  set("v-calc", (c ? brl(c) : "R$ ____") + " × 5,44% (valorização média dos imóveis em 12 meses)");

  // ---------- navegação ----------
  var slides = Array.prototype.slice.call(document.querySelectorAll(".slide"));
  var byN = {}; slides.forEach(function (s, i) { byN[s.dataset.n] = i; });
  var NEXT = { "17": "18", "18": "19", "19": "20", "20": "21", "21": "22", "22": "23" };
  var PREV = { "18": "17", "19": "18", "20": "19", "21": "20", "22": "21", "23": "22" };
  var cur = 0;
  function show(n) {
    var i = byN[n]; if (i === undefined) return;
    slides[cur].classList.remove("on"); cur = i; slides[cur].classList.add("on");
    redraw(slides[cur]);
  }
  function curN() { return slides[cur].dataset.n; }
  function next() { if (NEXT[curN()]) show(NEXT[curN()]); }
  function prev() { if (PREV[curN()]) show(PREV[curN()]); }
  slides[0].classList.add("on");
  document.addEventListener("keydown", function (e) {
    if (["ArrowRight", "PageDown", " ", "Enter"].indexOf(e.key) >= 0) { next(); e.preventDefault(); }
    if (["ArrowLeft", "PageUp", "Backspace"].indexOf(e.key) >= 0) { prev(); e.preventDefault(); }
  });

  // ---------- caneta (Apple Pencil desenha sempre; dedo navega; mouse/dedo desenham com "Caneta" ligada) ----------
  var penMode = false, tools = document.getElementById("tools");
  document.getElementById("penBtn").onclick = function () { penMode = !penMode; tools.classList.toggle("pen", penMode); };
  document.getElementById("clearBtn").onclick = function () { slides[cur]._strokes = []; redraw(slides[cur]); };
  slides.forEach(function (s) {
    var cv = document.createElement("canvas"); cv.className = "ink"; s.appendChild(cv); s._cv = cv; s._strokes = [];

    Array.prototype.forEach.call(s.querySelectorAll(".hot, .pdfbtn"), function (h) { s.appendChild(h); });
  });
  function redraw(s) {
    var cv = s._cv, r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    if (!r.width) return;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    var g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.lineCap = "round"; g.lineJoin = "round"; g.strokeStyle = "#E53935";
    s._strokes.forEach(function (st) {
      g.lineWidth = Math.max(1.5, r.width * 0.0022);

      st.forEach(function (pt, i) { var x = pt[0] * r.width, y = pt[1] * r.height; if (i) g.lineTo(x, y); else g.moveTo(x, y); });
      if (st.length === 1) g.lineTo(st[0][0] * r.width + 0.1, st[0][1] * r.height);
      g.stroke();
    });
  }
  window.addEventListener("resize", function () { redraw(slides[cur]); });

  var stage = document.getElementById("stage"), drawing = null, swipe = null;
  function rel(e) { var r = slides[cur]._cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; }
  stage.addEventListener("pointerdown", function (e) {
    if (e.target.closest && e.target.closest(".pdfbtn")) { swipe = null; return; }
    var hot = e.target.closest && e.target.closest(".hot");
    if (hot && e.pointerType !== "pen") { show(hot.dataset.go); return; }
    if (e.pointerType === "pen" || penMode) {
      drawing = [rel(e)]; slides[cur]._strokes.push(drawing); stage.setPointerCapture(e.pointerId); redraw(slides[cur]);
    } else { swipe = { x: e.clientX, y: e.clientY, t: Date.now() }; }
  });
  stage.addEventListener("pointermove", function (e) {
    if (!drawing) return;
    var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    evs.forEach(function (ev) { drawing.push(rel(ev)); });
    redraw(slides[cur]);
  });
  function end(e) {
    if (drawing) { drawing = null; return; }
    if (!swipe) return;
    var dx = e.clientX - swipe.x, dy = e.clientY - swipe.y, w = stage.getBoundingClientRect();
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); }
    else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
      var x = (e.clientX - w.left) / w.width;
      if (x > 0.85) next(); else if (x < 0.15) prev();
    }
    swipe = null;
  }
  stage.addEventListener("pointerup", end);
  stage.addEventListener("pointercancel", function () { drawing = null; swipe = null; });
  redraw(slides[0]);

  // ---------- PDF do cliente (slides 18, 19, 21 + qualquer slide com anotação) ----------
  var box = document.getElementById("pdfBox"), pdfFile = null, pdfUrl = null;
  function boxState(title, msg, ready) {
    document.getElementById("pdfTitle").textContent = title;
    document.getElementById("pdfMsg").textContent = msg;
    var canShare = ready && navigator.canShare && navigator.canShare({ files: [pdfFile] }) && navigator.maxTouchPoints > 1;
    document.getElementById("pdfShare").style.display = canShare ? "block" : "none";
    document.getElementById("pdfDown").style.display = ready ? "block" : "none";
    document.getElementById("pdfDown").className = canShare ? "" : "main";
    document.getElementById("pdfClose").style.display = ready || !pdfFile ? "block" : "none";
    box.classList.add("on");
  }
  function slug(s) {
    return s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
  }
  function renderSlide(s, W, H) {
    var on = s.classList.contains("on");
    if (!on) { s.style.display = "block"; s.style.visibility = "hidden"; }
    var sr = s.getBoundingClientRect(), k = W / sr.width;
    var c = document.createElement("canvas"); c.width = W; c.height = H;
    var g = c.getContext("2d");
    g.drawImage(s.querySelector("img.bg"), 0, 0, W, H);
    var range = document.createRange();
    Array.prototype.forEach.call(s.querySelectorAll(".t"), function (el) {
      var tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null), node;
      while ((node = tw.nextNode())) {
        var cs = getComputedStyle(node.parentElement);
        g.font = cs.fontStyle + " " + cs.fontWeight + " " + (parseFloat(cs.fontSize) * k) + "px " + cs.fontFamily;
        g.fillStyle = cs.color; g.textBaseline = "alphabetic";
        var m = g.measureText("Hg"), asc = m.fontBoundingBoxAscent || parseFloat(cs.fontSize) * k * 0.95;
        var txt = node.nodeValue;
        for (var i = 0; i < txt.length; i++) {
          if (/\s/.test(txt[i])) continue;
          range.setStart(node, i); range.setEnd(node, i + 1);
          var rs = range.getClientRects(); if (!rs.length) continue;
          g.fillText(txt[i], (rs[0].left - sr.left) * k, (rs[0].top - sr.top) * k + asc);
        }
      }
    });
    g.lineCap = "round"; g.lineJoin = "round"; g.strokeStyle = "#E53935"; g.lineWidth = Math.max(2, W * 0.0022);
    s._strokes.forEach(function (st) {
      g.beginPath();
      st.forEach(function (pt, i) { if (i) g.lineTo(pt[0] * W, pt[1] * H); else g.moveTo(pt[0] * W, pt[1] * H); });
      if (st.length === 1) g.lineTo(st[0][0] * W + 0.5, st[0][1] * H);
      g.stroke();
    });
    if (!on) { s.style.display = ""; s.style.visibility = ""; }
    return new Promise(function (res) {
      c.toBlob(function (b) { var fr = new FileReader(); fr.onload = function () { res(new Uint8Array(fr.result)); }; fr.readAsArrayBuffer(b); }, "image/jpeg", 0.9);
    });
  }
  function buildPdf(jpgs, W, H) {
    var enc = new TextEncoder(), parts = [], len = 0, offs = [], n = jpgs.length;
    function add(x) { var b = typeof x === "string" ? enc.encode(x) : x; parts.push(b); len += b.length; }
    function obj(id, fn) { offs[id] = len; add(id + " 0 obj\n"); fn(); add("\nendobj\n"); }
    add("%PDF-1.4\n%âãÏÓ\n");
    var kids = [];
    for (var i = 0; i < n; i++) kids.push((3 + 3 * i) + " 0 R");
    obj(1, function () { add("<< /Type /Catalog /Pages 2 0 R >>"); });
    obj(2, function () { add("<< /Type /Pages /Kids [" + kids.join(" ") + "] /Count " + n + " >>"); });
    jpgs.forEach(function (jpg, i) {
      var pg = 3 + 3 * i, ct = pg + 1, im = pg + 2, cmd = "q 960 0 0 540 0 0 cm /Im0 Do Q";
      obj(pg, function () { add("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 960 540] /Resources << /XObject << /Im0 " + im + " 0 R >> >> /Contents " + ct + " 0 R >>"); });
      obj(ct, function () { add("<< /Length " + cmd.length + " >>\nstream\n" + cmd + "\nendstream"); });
      obj(im, function () {
        add("<< /Type /XObject /Subtype /Image /Width " + W + " /Height " + H + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpg.length + " >>\nstream\n");
        add(jpg); add("\nendstream");
      });
    });
    var size = 3 + 3 * n, x = len, xref = "xref\n0 " + size + "\n0000000000 65535 f \n";
    for (var j = 1; j < size; j++) xref += ("0000000000" + offs[j]).slice(-10) + " 00000 n \n";
    add(xref + "trailer\n<< /Size " + size + " /Root 1 0 R >>\nstartxref\n" + x + "\n%%EOF\n");
    return new Blob(parts, { type: "application/pdf" });
  }
  document.getElementById("pdfBtn").addEventListener("click", function () {
    var nome = window.prompt("Nome do cliente (para o nome do arquivo):", "");
    if (nome === null) return;
    pdfFile = null; boxState("Gerando o PDF…", "Juntando os slides com as suas anotações.", false);
    var W = 1920, H = 1080, list = slides.filter(function (s) {
      return ["18", "19", "21"].indexOf(s.dataset.n) >= 0 || s._strokes.length;
    });
    var d = new Date(), dt = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
    var fname = "Proposta_" + (slug(nome) || "Cliente") + "_" + dt + ".pdf";
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () {
      return list.reduce(function (p, s) {
        return p.then(function (acc) { return renderSlide(s, W, H).then(function (j) { acc.push(j); return acc; }); });
      }, Promise.resolve([]));
    }).then(function (jpgs) {
      var blob = buildPdf(jpgs, W, H);
      try { pdfFile = new File([blob], fname, { type: "application/pdf" }); } catch (e) { pdfFile = blob; pdfFile.name = fname; }
      if (pdfUrl) URL.revokeObjectURL(pdfUrl);
      pdfUrl = URL.createObjectURL(blob);
      boxState("PDF pronto", fname + " · " + jpgs.length + " páginas. No iPad, toque em Salvar no Drive e escolha a pasta do Drive.", true);
    }).catch(function (e) { pdfFile = null; boxState("Não foi possível gerar", String(e && e.message || e), false); });
  });
  document.getElementById("pdfShare").onclick = function () {
    navigator.share({ files: [pdfFile], title: pdfFile.name }).catch(function () {});
  };
  document.getElementById("pdfDown").onclick = function () {
    var a = document.createElement("a"); a.href = pdfUrl; a.download = pdfFile.name; document.body.appendChild(a); a.click(); a.remove();
  };
  document.getElementById("pdfClose").onclick = function () { box.classList.remove("on"); };

  // ---------- modo offline: guarda a página no iPad depois da primeira abertura com internet ----------
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
